  </g><rect x="22" y="6.6" width="86" height="2.4" rx="1.2" fill="#f34b7d" opacity="0.95"/><text x="22" y="44" font-size="18.5" font-weight="700" fill="#f2f6ff">ChatServer</text><rect x="260.88" y="22" width="141.1" height="24.0" rx="12.0" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/><circle cx="273.88" cy="34.0" r="3" fill="#f34b7d"/><text x="282.88" y="38.0" font-size="11" font-weight="500" fill="#dfe7f8" opacity="1.0">7.3k 行 · 手写协议栈</text><text x="22" y="70" font-size="13" fill="#c2ccdf" opacity="0.92">从 socket 起步的 Reactor 通讯服务器。HTTP/1.1、WebSocket</text><text x="22" y="91" font-size="13" fill="#c2ccdf" opacity="0.92">RFC6455、SMTP RFC5321 三套协议全部自己解析，JSON 与</text><text x="22" y="112" font-size="13" fill="#c2ccdf" opacity="0.92">JWT 也自带。</text><circle cx="26" cy="150" r="3.4" fill="#f34b7d"/><text x="36" y="154" font-size="12" fill="#9fadc7">C++20</text><text x="216" y="154" font-size="11.5" fill="#8e9cb6">epoll / kqueue ｜ 环形缓冲 ｜ ctest</text></g></svg>