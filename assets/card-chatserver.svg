<svg xmlns="http://www.w3.org/2000/svg" width="424" height="176" viewBox="0 0 424 176" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}</style>
  <defs>
