<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}</style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.45" stop-color="#141b2d"/>
      <stop offset="1" stop-color="#0b0f18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05070d" flood-opacity="0.55"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="96" cy="116" r="46"/></clipPath>
  </defs>
<defs><clipPath id="cc"><rect width="900" height="300" rx="26" ry="26"/></clipPath></defs><g clip-path="url(#cc)">
  <rect x="0" y="0" width="900" height="300" fill="url(#base)"/>
  <g filter="url(#soft)" opacity="1.0">
    <ellipse cx="144" cy="30" rx="270" ry="165" fill="url(#blobA)"/>
    <ellipse cx="774" cy="54" rx="252" ry="186" fill="url(#blobB)"/>
    <ellipse cx="450" cy="315" rx="306" ry="144" fill="url(#blobC)"/>
  </g>
  <rect x="0" y="0" width="900" height="300" fill="url(#base)" opacity="0.4"/>
  <rect x="0" y="0" width="900" height="300" filter="url(#grain)" opacity="0.05"/>
  <g >
    <rect x="12" y="12" width="876" height="276" rx="22" fill="url(#glass)"
          stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="13" y="13" width="874" height="1.4" rx="0.7" fill="url(#topline)"/>
  </g>
  <circle cx="96" cy="116" r="50" fill="none" stroke="url(#ring)" stroke-width="2.4" opacity="0.9"/>
  <image x="50" y="70" width="92" height="92" clip-path="url(#avatarClip)"
         preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
  <circle cx="96" cy="116" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
  <text x="170" y="86" font-size="33" font-weight="700" fill="#f5f7ff" letter-spacing="0.4">AstonKrss</text>
  <text x="171" y="112" font-size="13" fill="#9aa7c2">@AstonKrss · github.com/AstonKrss</text>
  <text x="171" y="146" font-size="14.5" fill="#dbe3f5" opacity="0.92">系统底层性能 × 智能体工程 —— 从 epoll 与协议字节，到会自己规划下一步的 Agent。</text>
  <text x="171" y="170" font-size="14.5" fill="#dbe3f5" opacity="0.92">C++17 / 20 · Go · Java · Python ｜ 偏爱把边界、数字与取舍都写清楚的项目。</text><rect x="171" y="186" width="170.8" height="25.5" rx="12.8" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/><circle cx="187" cy="198.75" r="3" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="196" y="203.2" font-size="12.5" font-weight="500" fill="#c9d4ea" opacity="1.0">Focusing · 持续折腾中</text><rect x="26" y="234" width="147.2" height="25.0" rx="12.5" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/><circle cx="42" cy="246.5" r="3" fill="#7dd3fc"/><text x="51" y="250.8" font-size="12" font-weight="500" fill="#cfd9ee" opacity="1.0">44 次贡献 · 近一年</text><rect x="187.2" y="234" width="108.8" height="25.0" rx="12.5" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/><circle cx="203.2" cy="246.5" r="3" fill="#7dd3fc"/><text x="212.2" y="250.8" font-size="12" font-weight="500" fill="#cfd9ee" opacity="1.0">4 个主力项目</text><rect x="310.0" y="234" width="271.0" height="25.0" rx="12.5" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/><circle cx="326.0" cy="246.5" r="3" fill="#7dd3fc"/><text x="335.0" y="250.8" font-size="12" font-weight="500" fill="#cfd9ee" opacity="1.0">上游 PR：WeKnora · opentelemetry-java</text></g></svg>