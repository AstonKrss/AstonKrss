<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}</style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.45" stop-color="#141b2d"/>
      <stop offset="1" stop-color="#0b0f18"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05070d" flood-opacity="0.55"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="96" cy="116" r="46"/></clipPath>
  </defs>
<defs><clipPath id="cc"><rect width="900" height="92" rx="20" ry="20"/></clipPath></defs><g clip-path="url(#cc)">
  <rect x="0" y="0" width="900" height="92" fill="url(#base)"/>
  <g filter="url(#soft)" opacity="0.6">
    <ellipse cx="144" cy="9" rx="270" ry="51" fill="url(#blobA)"/>
    <ellipse cx="774" cy="17" rx="252" ry="57" fill="url(#blobB)"/>
    <ellipse cx="450" cy="97" rx="306" ry="44" fill="url(#blobC)"/>
  </g>
  <rect x="0" y="0" width="900" height="92" fill="url(#base)" opacity="0.55"/>
  <rect x="0" y="0" width="900" height="92" filter="url(#grain)" opacity="0.05"/>
  <g >
    <rect x="8" y="8" width="884" height="76" rx="16" fill="url(#glass)"
          stroke="url(#edge)" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="9" y="9" width="882" height="1.4" rx="0.7" fill="url(#topline)"/>
  </g><text x="450.0" y="42" font-size="15.5" font-style="italic" fill="#e8eefb" text-anchor="middle">数据不造假，边界写清楚 —— 所有数字都标注了机器、内核与配置。</text><text x="450.0" y="66" font-size="11.5" fill="#8b99b3" text-anchor="middle">—— heartbeatd README，也是我写项目的规矩</text></g></svg>